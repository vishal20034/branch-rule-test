name: Enforce PR-closer policy

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  enforce-closer:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if PR was merged
        if: ${{ github.event.pull_request.merged == true }}
        run: |
          echo "PR was merged; no enforcement required."
          exit 0

      - name: Enforce allowed closers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const actor = context.actor; // user who triggered the event (closed the PR)
            const author = pr.user.login;

            // Allow if actor is the PR author
            if (actor === author) {
              core.info(`Allowed: actor (${actor}) is the PR author.`);
              return;
            }

            // Gather requested reviewers (users)
            const requested = (pr.requested_reviewers || []).map(r => r.login);

            // Fetch reviews to see who actually reviewed
            const reviewsResp = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const reviewersFromHistory = (reviewsResp.data || []).map(r => r.user && r.user.login).filter(Boolean);

            const allowedSet = new Set([...requested, ...reviewersFromHistory]);

            if (allowedSet.has(actor)) {
              core.info(`Allowed: actor (${actor}) is a reviewer/requested reviewer.`);
              return;
            }

            // Check if actor is an admin collaborator
            try {
              const permResp = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              });
              const level = permResp.data.permission; // 'admin', 'write', 'read'
              if (level === 'admin') {
                core.info(`Allowed: actor (${actor}) has admin permission.`);
                return;
              }
            } catch (err) {
              core.info(`Permission check failed for ${actor}: ${err.message}`);
            }

            // Not allowed -> reopen and comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `🔁 This PR was reopened automatically because it was closed by \`${actor}\`, who is not the PR author, a reviewer, or an admin.\n\n` +
                    `Policy: PRs should be closed only by the PR author, reviewers, or an administrator. If you believe this close was valid, please ask an admin to close it and explain the reason here.`
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'open'
            });

            core.setOutput("reopened_by_workflow", "true");
