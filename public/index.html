<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations API</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
    main { max-width: 720px; margin: 48px auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; }
    h1 { margin: 0 0 8px; }
    .ok { color: #15803d; font-weight: 700; }
    code, pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    code { padding: 2px 6px; }
    pre { padding: 12px; overflow: auto; }
    a { color: #2563eb; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    button { background: #0f172a; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <p class="ok">Site is live (HTML page, not a file download)</p>
    <h1>Operations API</h1>
    <p>Dev / preview host on Vercel. JSON API is on the same domain.</p>
    <div class="row">
      <a href="/api/health">/health</a>
      <a href="/api/env-check">/env-check</a>
      <a href="/api/orders">/orders/demo</a>
      <button type="button" id="ping">Ping API</button>
    </div>
    <pre id="out">Click Ping API…</pre>
  </main>
  <script>
    async function ping() {
      const out = document.getElementById('out');
      out.textContent = 'loading…';
      try {
        const res = await fetch('/api/health');
        const text = await res.text();
        out.textContent = res.status + ' ' + text;
      } catch (e) {
        out.textContent = String(e);
      }
    }
    document.getElementById('ping').onclick = ping;
    ping();
  </script>
</body>
</html>
