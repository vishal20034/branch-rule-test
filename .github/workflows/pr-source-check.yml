name: PR Source Branch Check

on:
  pull_request:
    branches: [main]          # only runs on PRs targeting main
    types: [opened, reopened, synchronize, edited]

jobs:
  check-source-branch:
    name: Check PR source is rc/*
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch starts with rc/
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "Source branch: $SOURCE"

          if [[ "$SOURCE" != rc/* ]]; then
            echo "❌ ERROR: Pull Requests into main are ONLY allowed from rc/* branches."
            echo "   This PR is from: $SOURCE"
            echo "   Please create an rc/* branch, merge your feat work into it, then open the PR from the rc branch."
            exit 1
          fi

          echo "✅ Source branch is valid: $SOURCE"
