name: PR Source Branch Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        run: |
          SRC="${{ github.head_ref }}"
          echo "Source branch: $SRC"
          echo "Target branch: ${{ github.base_ref }}"
          case "$SRC" in
            rc|rc/*|rc-*)
              echo "OK: PRs into main must come from an rc branch."
              ;;
            *)
              echo "PRs into main must come from rc, rc/*, or rc-*."
              exit 1
              ;;
          esac
