name: DEV - GitHub Actions -> Azure

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  WEBAPP_NAME: "test-webapp-dev"
  FUNCTION_APP_NAME: "test-function-dev"

jobs:

  # ==========================================================
  # STEP 2
  # Open PR: feat/* -> dev
  # CI only: lint + tests
  # ==========================================================

  step-2-pr-ci:
    name: "2. PR CI - Lint and Tests"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          flake8 . --exclude=.git,antenv

      - name: Tests
        run: |
          export PYTHONPATH="$(pwd)"
          pytest -q tests --tb=short


  # ==========================================================
  # STEP 4
  # Email 1 - CI/CD started
  # ==========================================================

  step-4-email-started:
    name: "4. Email 1 - CI/CD started"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send CI/CD started email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD started" \
            "CI/CD started. Branch: dev. Development deployment is in progress."


  # ==========================================================
  # STEP 5
  # Build / Test
  # ==========================================================

  step-5-build-test:
    name: "5. Build and Test"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: step-4-email-started
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create environment and install requirements
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          source antenv/bin/activate
          export PYTHONPATH="$(pwd)"
          pytest -q tests \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --tb=short


  # ==========================================================
  # STEP 6
  # Build package ONCE
  # Function App artifact + App Service artifact
  # ==========================================================

  step-6-package:
    name: "6. Build Package ONCE"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: step-5-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt

      - name: Build packages once
        run: |
          set -e

          rm -rf package
          mkdir -p package/webapp
          mkdir -p package/function

          cp -a app.py requirements.txt package/webapp/

          if [ -d templates ]; then
            cp -a templates package/webapp/
          fi

          if [ -d static ]; then
            cp -a static package/webapp/
          fi

          if [ -f startup.sh ]; then
            cp -a startup.sh package/webapp/
          fi

          if [ -f .deployment ]; then
            cp -a .deployment package/webapp/
          fi

          cp -a . package/function/ \
            --exclude=.git \
            --exclude=package \
            --exclude=antenv \
            --exclude=tests

          cd package/webapp
          zip -r ../../webapp.zip .

          cd ../function
          zip -r ../../function.zip .

      - name: Upload App Service artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-app-service
          path: webapp.zip

      - name: Upload Function App artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-function-app
          path: function.zip


  # ==========================================================
  # STEP 7
  # Deploy to Azure Dev
  # Function App + App Service
  # GitHub Environment: dev
  # ==========================================================

  step-7-deploy:
    name: "7. Deploy Azure Dev"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: step-6-package
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Download App Service artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-app-service

      - name: Download Function App artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-function-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Dev App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: webapp.zip

      - name: Deploy Azure Dev Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function.zip


  # ==========================================================
  # STEP 8
  # Email 3 - Succeeded
  # ==========================================================

  step-8-success:
    name: "8. Email 3 - Succeeded"
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.step-7-deploy.result == 'success'
    needs:
      - step-4-email-started
      - step-5-build-test
      - step-6-package
      - step-7-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send success email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD Succeeded" \
            "CI/CD succeeded. Branch: dev. Azure Dev Function App and Azure Dev App Service were deployed successfully."


  # ==========================================================
  # STEP 8
  # Email 2 - Failed
  # ==========================================================

  step-8-failed:
    name: "8. Email 2 - Failed"
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      (
        needs.step-4-email-started.result == 'failure' ||
        needs.step-5-build-test.result == 'failure' ||
        needs.step-6-package.result == 'failure' ||
        needs.step-7-deploy.result == 'failure'
      )
    needs:
      - step-4-email-started
      - step-5-build-test
      - step-6-package
      - step-7-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send failure email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD Failed" \
            "CI/CD failed. Branch: dev. The Development pipeline has stopped. Check the GitHub Actions run for the failed step."
