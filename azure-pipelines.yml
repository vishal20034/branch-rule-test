# GitHub + Azure Pipelines + Sonar on the AVD (localhost). No ngrok.
#
# AUTOMATIC:
#   Push/merge to rc  → Build (Linux) + Sonar (AVD agent) + mail + Deploy.
#   After prod deploy → Soak 6-7 hours. Do NOT merge to main yet.
#   After soak        → mail "PR rc to main now".
#   Push/merge to main → Build + Sonar only. No Azure.
#
# Set secret variables: GMAIL_USER, GMAIL_APP_PASSWORD
# GMAIL_TO = specific people, comma-separated
# Service connection test-sonar Server Url MUST be http://127.0.0.1:9000
# Agent pool Default = Azure Pipelines agent installed on the AVD.

trigger:
  branches:
    include:
      - main
      - rc
      - rc/*
      - rc-*

pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: ci
    values:
      - ci
      - deploy
      - rollback
  - name: rollbackBranch
    displayName: Branch to deploy (rollback only)
    type: string
    default: main

variables:
  azureServiceConnectionId: 'd3ebfeec-7df4-41b6-bbdd-03353e1c1272'
  webAppName: 'test-webapp'
  vmImageName: 'ubuntu-latest'
  environmentName: 'test-webapp'
  projectRoot: $(System.DefaultWorkingDirectory)
  pythonVersion: '3.11'
  packageName: app.zip
  mailUser: $(GMAIL_USER)
  mailPass: $(GMAIL_APP_PASSWORD)
  mailTo: $(GMAIL_TO)

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    displayName: Package (Linux)
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: python3 send_mail.py "[CI/CD] Started" "Repo $(Build.Repository.Name) branch $(Build.SourceBranchName) action ${{ parameters.action }} run $(Build.BuildId)"
      displayName: Email - CI/CD started
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - script: |
        set -e
        ACTION="${{ parameters.action }}"
        BRANCH="${{ parameters.rollbackBranch }}"
        echo "Action=$ACTION"
        echo "Pipeline branch=$(Build.SourceBranch)"
        echo "Rollback branch=$BRANCH"
        if [ "$ACTION" = "rollback" ]; then
          git fetch origin
          git checkout -f "$BRANCH" || git checkout -f "origin/$BRANCH"
          echo "Now at $(git rev-parse --abbrev-ref HEAD) $(git rev-parse --short HEAD)"
        fi
      displayName: Checkout rollback branch if requested

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        set -e
        python -m venv antenv
        source antenv/bin/activate
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: Create antenv and install requirements

    - script: |
        set -e
        source antenv/bin/activate
        python -m pip install pytest pytest-cov
        export PYTHONPATH="$(pwd)"
        pytest -q tests --cov=app --cov-report=xml:coverage.xml --tb=short
      workingDirectory: $(projectRoot)
      displayName: Pytest with coverage
      condition: ne('${{ parameters.action }}', 'rollback')

    - script: |
        set -e
        STAGING="$(Build.ArtifactStagingDirectory)/pkg"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        cp -a antenv app.py requirements.txt "$STAGING/"
        cp -a templates static "$STAGING/"
        [ -f startup.sh ] && cp -a startup.sh "$STAGING/"
        [ -f .deployment ] && cp -a .deployment "$STAGING/"
      workingDirectory: $(projectRoot)
      displayName: Stage package (app + antenv, no .git)

    - task: ArchiveFiles@2
      displayName: Zip package
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/pkg'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(packageName)
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(packageName)
      displayName: Upload artifact
      artifact: drop

    - script: python3 send_mail.py "[CI/CD] Build and tests done - approve deploy" "Build and tests are done. If you have permission, open this Azure DevOps link and click Approve to deploy. $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      displayName: Email - approve deploy link
      condition: |
        and(
          succeeded(),
          or(
            eq('${{ parameters.action }}', 'deploy'),
            eq('${{ parameters.action }}', 'rollback'),
            startsWith(variables['Build.SourceBranch'], 'refs/heads/rc')
          )
        )
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

  - job: SonarJob
    displayName: Sonar on AVD (localhost, no ngrok)
    pool:
      name: Default
    steps:
    - checkout: self
      fetchDepth: 0

    - powershell: |
        python send_mail.py "[CI/CD] SonarQube started" "Sonar starting for $(Build.SourceBranchName) run $(Build.BuildId)"
      displayName: Email - SonarQube started
      condition: ne('${{ parameters.action }}', 'rollback')
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - task: SonarQubePrepare@7
      displayName: SonarQube prepare
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        SonarQube: 'test-sonar'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'branch-rule-test'
        extraProperties: |
          sonar.python.version=3.11
          sonar.sources=.
          sonar.tests=tests
          sonar.exclusions=**/antenv/**,**/.git/**,**/__pycache__/**,**/.scannerwork/**
          sonar.python.coverage.reportPaths=coverage.xml
          sonar.qualitygate.wait=true

    - powershell: |
        python -m pip install -q pytest pytest-cov
        $env:PYTHONPATH = (Get-Location).Path
        python -m pytest -q tests --cov=app --cov-report=xml:coverage.xml --tb=short
      displayName: Pytest coverage for Sonar
      condition: ne('${{ parameters.action }}', 'rollback')

    - powershell: |
        $raw = $env:SONARQUBE_SCANNER_PARAMS
        if (-not $raw) { $raw = '{}' }
        $data = $raw | ConvertFrom-Json
        $keep = @{}
        $data.PSObject.Properties | ForEach-Object {
          if ($_.Name -notlike 'sonar.branch.*' -and $_.Name -notlike 'sonar.pullrequest.*') {
            $keep[$_.Name] = $_.Value
          }
        }
        $json = ($keep | ConvertTo-Json -Compress)
        Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$json"
      displayName: Strip branch params (Sonar Community Edition)
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubeAnalyze@7
      displayName: SonarQube analyze
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubePublish@7
      displayName: SonarQube publish
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        pollingTimeoutSec: '300'

    - powershell: |
        python -m pip install -q fpdf2 matplotlib
        python sonar_mail.py PASSED "[CI/CD] SonarQube PASSED"
      displayName: Email - SonarQube passed + PDF
      condition: and(succeeded(), ne('${{ parameters.action }}', 'rollback'))
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - powershell: |
        python -m pip install -q fpdf2 matplotlib
        python sonar_mail.py FAILED "[CI/CD] FAILED"
      displayName: Email - CI/CD failed + Sonar PDF
      condition: failed()
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

- stage: Deploy
  displayName: Deploy Web App
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      or(
        eq('${{ parameters.action }}', 'deploy'),
        eq('${{ parameters.action }}', 'rollback'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/rc')
      )
    )
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: python3 send_mail.py "[CI/CD] Deploy started" "Deploying $(webAppName) action ${{ parameters.action }} run $(Build.BuildId)"
            displayName: Email - Deploy started
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)
          - task: AzureWebApp@1
            displayName: Deploy test-webapp
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(packageName)
          - script: python3 send_mail.py "[CI/CD] Implementation done" "CI/CD implementation done. Production is live. Do NOT merge rc into main for 6-7 hours. Watch logs. Soak is waiting. run $(Build.BuildId)"
            displayName: Email - CI/CD implementation done
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)
          - script: python3 send_mail.py "[CI/CD] Deploy FAILED" "test-webapp deploy failed action ${{ parameters.action }} run $(Build.BuildId)"
            displayName: Email - Deploy failed
            condition: failed()
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)

- stage: Soak
  displayName: Soak 6-7 hours (do not merge to main)
  dependsOn: Deploy
  condition: and(succeeded(), ne('${{ parameters.action }}', 'rollback'))
  jobs:
  - job: wait_soak
    displayName: Wait 6-7 hours
    pool: server
    timeoutInMinutes: 450
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 420
      inputs:
        notifyUsers: $(GMAIL_TO)
        instructions: "Production soak. Wait 6 to 7 hours. Watch Azure logs. Do NOT merge rc into main until this step is Resumed or it times out (7 hours)."
        onTimeout: resume
  - job: soak_done_mail
    displayName: Email - soak done PR to main
    dependsOn: wait_soak
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
    - script: python3 send_mail.py "[CI/CD] Soak done - PR rc to main" "6-7 hour production soak is complete. You may now open a pull request from rc into main. $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      displayName: Email - soak complete
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)
