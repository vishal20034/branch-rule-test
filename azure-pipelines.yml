name: DEV - GitHub Actions -> Azure

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"


jobs:

  # ==========================================================
  # STEP 2
  # feat/* -> PR -> dev
  # CI ONLY: Lint + Tests
  # NO DEPLOYMENT
  # ==========================================================

  step-2-pr-ci:
    name: "2. PR CI - Lint and Tests"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          flake8 . --exclude=.git,antenv

      - name: Tests
        run: |
          export PYTHONPATH="$(pwd)"
          pytest -q tests --tb=short


  # ==========================================================
  # STEP 4
  # Email 1 - CI/CD Started
  # Runs when code is merged/pushed into dev
  # ==========================================================

  step-4-email-started:
    name: "4. Email 1 - CI/CD Started"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Send CI/CD Started Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD Started" \
            "CI/CD started. Branch: dev. Development deployment is in progress."


  # ==========================================================
  # STEP 5
  # Build + Test
  # ==========================================================

  step-5-build-test:
    name: "5. Build and Test"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - step-4-email-started
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment and install requirements
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          source antenv/bin/activate
          export PYTHONPATH="$(pwd)"
          pytest -q tests \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --tb=short


  # ==========================================================
  # STEP 6
  # Build Package ONCE
  # Web App / App Service ONLY
  # ==========================================================

  step-6-package:
    name: "6. Build Package Once"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - step-5-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create package directory
        run: |
          rm -rf package
          mkdir -p package/webapp

      - name: Prepare Web App package
        run: |
          set -e

          cp -a app.py package/webapp/

          if [ -f requirements.txt ]; then
            cp -a requirements.txt package/webapp/
          fi

          if [ -d templates ]; then
            cp -a templates package/webapp/
          fi

          if [ -d static ]; then
            cp -a static package/webapp/
          fi

          if [ -f startup.sh ]; then
            cp -a startup.sh package/webapp/
          fi

          if [ -f .deployment ]; then
            cp -a .deployment package/webapp/
          fi

      - name: Create Web App artifact
        run: |
          cd package/webapp
          zip -r ../../webapp.zip .

      - name: Upload Web App artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-app-service
          path: webapp.zip
          retention-days: 30


  # ==========================================================
  # STEP 7
  # Deploy to Azure DEV Web App
  #
  # GitHub Environment: dev
  # No manual approval
  # ==========================================================

  step-7-deploy:
    name: "7. Deploy Azure Dev Web App"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - step-6-package
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Download Web App artifact
        uses: actions/download-artifact@v4
        with:
          name: dev-app-service
          path: package

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Dev Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_DEV }}
          package: package/webapp.zip


  # ==========================================================
  # STEP 8
  # Email 3 - Succeeded
  # ==========================================================

  step-8-success:
    name: "8. Email 3 - Succeeded"
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.step-7-deploy.result == 'success'

    needs:
      - step-4-email-started
      - step-5-build-test
      - step-6-package
      - step-7-deploy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Send Success Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD Succeeded" \
            "CI/CD succeeded. Branch: dev. Azure Dev Web App was deployed successfully."


  # ==========================================================
  # STEP 8
  # Email 2 - Failed
  # ==========================================================

  step-8-failed:
    name: "8. Email 2 - Failed"

    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      (
        needs.step-4-email-started.result == 'failure' ||
        needs.step-5-build-test.result == 'failure' ||
        needs.step-6-package.result == 'failure' ||
        needs.step-7-deploy.result == 'failure'
      )

    needs:
      - step-4-email-started
      - step-5-build-test
      - step-6-package
      - step-7-deploy

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Send Failure Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python send_mail.py \
            "[DEV] CI/CD Failed" \
            "CI/CD failed. Branch: dev. The Development pipeline has stopped. Check the GitHub Actions run for the failed step."
