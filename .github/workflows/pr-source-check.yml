name: PR Source Branch Check

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check-source-branch:
    name: Check PR source is rc/*
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch starts with rc/
        run: |
          SOURCE="${{ github.head_ref }}"
          echo "Source branch: $SOURCE"

          if [[ "$SOURCE" != rc-* ]]; then
            echo "❌ ERROR: Pull Requests into main are ONLY allowed from rc/* branches."
            echo "   This PR is from: $SOURCE"
            exit 1
          fi

          echo "✅ Source branch is valid: $SOURCE"

      - name: Close invalid Pull Request
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sourceBranch = context.payload.pull_request.head.ref;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `❌ **This Pull Request has been automatically closed.**\n\n` +
                    `Only branches starting with \`rc/\` are allowed to create PRs into \`main\`.\n` +
                    `Your branch \`${sourceBranch}\` is not allowed.\n\n` +
                    `Please create an \`rc/*\` branch, merge your feature work into it, and then open a new PR.`
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed'
            });
