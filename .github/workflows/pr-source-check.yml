
name: PR Source Branch Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != rc/* ]]; then
            echo "❌ PRs into main are only allowed from rc/* branches."
            echo "This PR is from: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ Source branch is valid."
