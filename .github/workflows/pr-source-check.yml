name: PR Source Branch Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          if [[ "${{ github.head_ref }}" != rc/* ]]; then
            echo "❌ PRs into main must come from an rc/* branch."
            exit 1
          fi
          echo "✅ Source branch is valid."