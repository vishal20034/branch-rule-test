# GitHub + Azure Pipelines + Sonar. No GoCD.
#
# AUTOMATIC:
#   Push/merge to rc  → Build + Sonar + mail. No Azure.
#   Push/merge to main → Build + Sonar + mail + Deploy stage
#                        (Deploy waits on Environment approval if you set it).
#
# MANUAL:
#   Run pipeline → Action = deploy or rollback.
#
# Set secret variables: GMAIL_USER, GMAIL_APP_PASSWORD, GMAIL_TO
# Environment test-webapp → Approvals = who may allow production.

trigger:
  branches:
    include:
      - main
      - rc
      - rc/*
      - rc-*

pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: ci
    values:
      - ci
      - deploy
      - rollback
  - name: rollbackBranch
    displayName: Branch to deploy (rollback only)
    type: string
    default: main

variables:
  azureServiceConnectionId: 'd3ebfeec-7df4-41b6-bbdd-03353e1c1272'
  webAppName: 'test-webapp'
  vmImageName: 'ubuntu-latest'
  environmentName: 'test-webapp'
  projectRoot: $(System.DefaultWorkingDirectory)
  pythonVersion: '3.11'
  packageName: app.zip
  mailUser: $(GMAIL_USER)
  mailPass: $(GMAIL_APP_PASSWORD)
  mailTo: $(GMAIL_TO)

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: python3 send_mail.py "[CI/CD] Started" "Repo $(Build.Repository.Name) branch $(Build.SourceBranchName) action ${{ parameters.action }} run $(Build.BuildId)"
      displayName: Email - CI/CD started
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - script: |
        set -e
        ACTION="${{ parameters.action }}"
        BRANCH="${{ parameters.rollbackBranch }}"
        echo "Action=$ACTION"
        echo "Pipeline branch=$(Build.SourceBranch)"
        echo "Rollback branch=$BRANCH"
        if [ "$ACTION" = "rollback" ]; then
          git fetch origin
          git checkout -f "$BRANCH" || git checkout -f "origin/$BRANCH"
          echo "Now at $(git rev-parse --abbrev-ref HEAD) $(git rev-parse --short HEAD)"
        fi
      displayName: Checkout rollback branch if requested

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        set -e
        python -m venv antenv
        source antenv/bin/activate
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: Create antenv and install requirements

    - script: python3 send_mail.py "[CI/CD] SonarQube started" "Sonar starting for $(Build.SourceBranchName) run $(Build.BuildId)"
      displayName: Email - SonarQube started
      condition: ne('${{ parameters.action }}', 'rollback')
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - task: SonarQubePrepare@7
      displayName: SonarQube prepare
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        SonarQube: 'test-sonar'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'branch-rule-test'
        extraProperties: |
          sonar.python.version=3.11
          sonar.sources=.
          sonar.tests=tests
          sonar.exclusions=**/antenv/**,**/.git/**,**/__pycache__/**,**/.scannerwork/**
          sonar.python.coverage.reportPaths=coverage.xml
          sonar.qualitygate.wait=true

    - script: |
        python3 - << 'PY'
        import json, os
        raw = os.environ.get("SONARQUBE_SCANNER_PARAMS") or "{}"
        data = json.loads(raw)
        for key in list(data):
            if key.startswith("sonar.branch.") or key.startswith("sonar.pullrequest."):
                data.pop(key, None)
        line = "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]" + json.dumps(data, separators=(",", ":"))
        print(line)
        PY
      displayName: Strip branch params (Sonar Community Edition)
      condition: ne('${{ parameters.action }}', 'rollback')

    - script: |
        set -e
        source antenv/bin/activate
        python -m pip install pytest pytest-cov
        export PYTHONPATH="$(pwd)"
        pytest -q tests --cov=app --cov-report=xml:coverage.xml --tb=short
      workingDirectory: $(projectRoot)
      displayName: Pytest with coverage
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubeAnalyze@7
      displayName: SonarQube analyze
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubePublish@7
      displayName: SonarQube publish
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        pollingTimeoutSec: '300'

    - script: python3 sonar_mail.py PASSED "[CI/CD] SonarQube PASSED"
      displayName: Email - SonarQube passed + report
      condition: and(succeeded(), ne('${{ parameters.action }}', 'rollback'))
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - script: python3 sonar_mail.py FAILED "[CI/CD] FAILED"
      displayName: Email - CI/CD failed + Sonar report
      condition: failed()
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

    - script: |
        set -e
        STAGING="$(Build.ArtifactStagingDirectory)/pkg"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        cp -a antenv app.py requirements.txt "$STAGING/"
        cp -a templates static "$STAGING/"
        [ -f startup.sh ] && cp -a startup.sh "$STAGING/"
        [ -f .deployment ] && cp -a .deployment "$STAGING/"
      workingDirectory: $(projectRoot)
      displayName: Stage package (app + antenv, no .git)

    - task: ArchiveFiles@2
      displayName: Zip package
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/pkg'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(packageName)
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(packageName)
      displayName: Upload artifact
      artifact: drop

    - script: python3 send_mail.py "[CI/CD] Build and tests done — approve deploy" "Build and tests are done. If you have permission, open this Azure DevOps link and click Approve to deploy: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
      displayName: Email - approve deploy link
      condition: |
        and(
          succeeded(),
          or(
            eq('${{ parameters.action }}', 'deploy'),
            eq('${{ parameters.action }}', 'rollback'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main')
          )
        )
      env:
        GMAIL_USER: $(mailUser)
        GMAIL_APP_PASSWORD: $(mailPass)
        GMAIL_TO: $(mailTo)

- stage: Deploy
  displayName: Deploy Web App
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      or(
        eq('${{ parameters.action }}', 'deploy'),
        eq('${{ parameters.action }}', 'rollback'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    )
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: python3 send_mail.py "[CI/CD] Deploy started" "Deploying $(webAppName) action ${{ parameters.action }} run $(Build.BuildId)"
            displayName: Email - Deploy started
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)
          - task: AzureWebApp@1
            displayName: Deploy test-webapp
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(packageName)
          - script: python3 send_mail.py "[CI/CD] Implementation done" "CI/CD implementation done. test-webapp deploy succeeded. action ${{ parameters.action }} run $(Build.BuildId)"
            displayName: Email - CI/CD implementation done
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)
          - script: python3 send_mail.py "[CI/CD] Deploy FAILED" "test-webapp deploy failed action ${{ parameters.action }} run $(Build.BuildId)"
            displayName: Email - Deploy failed
            condition: failed()
            env:
              GMAIL_USER: $(mailUser)
              GMAIL_APP_PASSWORD: $(mailPass)
              GMAIL_TO: $(mailTo)
