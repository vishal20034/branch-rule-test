name: TEST - Gmail Email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-email:
    name: "Test Gmail"
    runs-on: ubuntu-latest

    steps:
      - name: Check Gmail secrets
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          if [ -z "$GMAIL_USER" ]; then
            echo "ERROR: GMAIL_USER is missing"
            exit 1
          fi

          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "ERROR: GMAIL_APP_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$GMAIL_TO" ]; then
            echo "ERROR: GMAIL_TO is missing"
            exit 1
          fi

          echo "All three Gmail secrets are available."

      - name: Send test email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          user = os.environ["GMAIL_USER"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          recipient = os.environ["GMAIL_TO"]

          msg = EmailMessage()
          msg["Subject"] = "[TEST] GitHub Actions Gmail"
          msg["From"] = user
          msg["To"] = recipient
          msg.set_content(
              "This is a test email from GitHub Actions.\n\n"
              "If you received this email, Gmail integration is working."
          )

          print("Connecting to Gmail SMTP...")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(user, password)
              print("Gmail login successful.")

              smtp.send_message(msg)
              print("Email sent successfully.")
          PY
