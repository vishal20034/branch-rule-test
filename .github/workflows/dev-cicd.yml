# Dev CI/CD — GitHub Actions only
# Real email via Gmail SMTP (App Password). No Azure.

name: Dev CI/CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-start:
    name: Email 1 - CI/CD Started
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send CI/CD Started email
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_SUBJECT: "[DEV] CI/CD Started — ${{ github.repository }}"
          MAIL_BODY: |
            Dev CI/CD started.

            Repo:   ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor:  ${{ github.actor }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/send_dev_mail.py

  test:
    name: Run automated tests
    needs: notify-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run basic checks
        run: |
          echo "Running Dev automated tests..."
          test -f README.md
          test -d .github
          echo "All basic checks passed."

  build:
    name: Build package once
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Function App package
        run: |
          mkdir -p packages/function
          cp README.md packages/function/
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > packages/function/build-info.txt
          echo "commit=${{ github.sha }}" >> packages/function/build-info.txt
      - name: Create App Service package
        run: |
          mkdir -p packages/appservice
          cp README.md packages/appservice/
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > packages/appservice/build-info.txt
          echo "commit=${{ github.sha }}" >> packages/appservice/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: packages/function/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: appservice-package
          path: packages/appservice/
          retention-days: 14

  deploy:
    name: Deploy to Dev Environment
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-package
          path: packages/function/
      - uses: actions/download-artifact@v4
        with:
          name: appservice-package
          path: packages/appservice/
      - name: Simulate Deploy to Dev Function App
        run: |
          echo ">>> Dev Function App deploy (simulated — no Azure)"
          ls -la packages/function/
          cat packages/function/build-info.txt
      - name: Simulate Deploy to Dev App Service
        run: |
          echo ">>> Dev App Service deploy (simulated — no Azure)"
          ls -la packages/appservice/
          cat packages/appservice/build-info.txt

  notify-success:
    name: Email 3 - CI/CD Succeeded
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send CI/CD Succeeded email
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_SUBJECT: "[DEV] CI/CD SUCCEEDED — Dev deploy completed"
          MAIL_BODY: |
            Dev deploy completed.

            Function App + App Service path finished (simulated until Azure is connected).
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/send_dev_mail.py

  notify-failure:
    name: Email 2 - CI/CD Failed
    if: failure()
    needs: [notify-start, test, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send CI/CD Failed email
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_SUBJECT: "[DEV] CI/CD FAILED"
          MAIL_BODY: |
            Dev CI/CD failed.

            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/send_dev_mail.py
