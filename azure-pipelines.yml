# CI on rc/* automatically (Build + Sonar).
# Deploy to Azure ONLY when someone clicks Run pipeline (manual).
# Rollback = Run pipeline → set Action = rollback → pick Branch to deploy.
# GitHub: only rc/* (and rc / rc-*) may merge to main.

trigger:
  branches:
    include:
      - rc
      - rc/*
      - rc-*

pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: ci
    values:
      - ci
      - deploy
      - rollback
  - name: rollbackBranch
    displayName: Branch to deploy (used when Action = rollback)
    type: string
    default: main

variables:
  azureServiceConnectionId: 'd3ebfeec-7df4-41b6-bbdd-03353e1c1272'
  webAppName: 'test-webapp'
  vmImageName: 'ubuntu-latest'
  environmentName: 'test-webapp'
  projectRoot: $(System.DefaultWorkingDirectory)
  pythonVersion: '3.11'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: |
        set -e
        ACTION="${{ parameters.action }}"
        BRANCH="${{ parameters.rollbackBranch }}"
        echo "Action=$ACTION SourceBranch=$(Build.SourceBranch) RollbackBranch=$BRANCH"
        if [ "$ACTION" = "rollback" ]; then
          git fetch origin
          git checkout "$BRANCH"
          echo "Checked out rollback branch $BRANCH at $(git rev-parse --short HEAD)"
        fi
      displayName: Checkout rollback branch if requested

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        python -m venv antenv
        source antenv/bin/activate
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: Install requirements

    - task: SonarQubePrepare@6
      displayName: SonarQube prepare
      inputs:
        SonarQube: 'test-sonar'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'branch-rule-test'
        extraProperties: |
          sonar.python.version=3.11
          sonar.sources=.
          sonar.exclusions=**/antenv/**,**/.git/**,**/__pycache__/**

    - script: |
        source antenv/bin/activate
        python -m pip install pytest pytest-cov
        pytest -q --cov=app --cov-report=xml:coverage.xml || true
      workingDirectory: $(projectRoot)
      displayName: Tests and coverage
      continueOnError: true

    - task: SonarQubeAnalyze@6
      displayName: SonarQube analyze

    - task: SonarQubePublish@6
      displayName: SonarQube publish
      inputs:
        pollingTimeoutSec: '300'
      continueOnError: true

    - task: ArchiveFiles@2
      displayName: Archive files
      inputs:
        rootFolderOrFile: '$(projectRoot)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: Upload package
      artifact: drop

- stage: Deploy
  displayName: Deploy Web App (manual only)
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      or(
        eq('${{ parameters.action }}', 'deploy'),
        eq('${{ parameters.action }}', 'rollback'),
        eq(variables['Build.Reason'], 'Manual')
      )
    )
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: Use Python version
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : test-webapp'
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
