# GitHub + Azure Pipelines + Sonar. No GoCD.
#
# Auto (push to rc / rc-* / rc/*):
#   Build + tests + Sonar. NO Azure deploy.
#
# Prod deploy:
#   Run pipeline → Action = deploy → (optional) Environment approve.
#
# Rollback:
#   Run pipeline → Action = rollback → Branch to deploy = e.g. main
#   Skips Sonar so an old branch can still be restored.

trigger:
  branches:
    include:
      - rc
      - rc/*
      - rc-*

pr: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: ci
    values:
      - ci
      - deploy
      - rollback
  - name: rollbackBranch
    displayName: Branch to deploy (rollback only)
    type: string
    default: main

variables:
  azureServiceConnectionId: 'd3ebfeec-7df4-41b6-bbdd-03353e1c1272'
  webAppName: 'test-webapp'
  vmImageName: 'ubuntu-latest'
  environmentName: 'test-webapp'
  projectRoot: $(System.DefaultWorkingDirectory)
  pythonVersion: '3.11'
  packageName: app.zip

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: |
        set -e
        ACTION="${{ parameters.action }}"
        BRANCH="${{ parameters.rollbackBranch }}"
        echo "Action=$ACTION"
        echo "Pipeline branch=$(Build.SourceBranch)"
        echo "Rollback branch=$BRANCH"
        if [ "$ACTION" = "rollback" ]; then
          git fetch origin
          git checkout -f "$BRANCH" || git checkout -f "origin/$BRANCH"
          echo "Now at $(git rev-parse --abbrev-ref HEAD) $(git rev-parse --short HEAD)"
        fi
      displayName: Checkout rollback branch if requested

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        set -e
        python -m venv antenv
        source antenv/bin/activate
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install -r requirements.txt
      workingDirectory: $(projectRoot)
      displayName: Create antenv and install requirements

    - task: SonarQubePrepare@5
      displayName: SonarQube prepare
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        SonarQube: 'test-sonar'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'branch-rule-test'
        extraProperties: |
          sonar.python.version=3.11
          sonar.sources=.
          sonar.tests=tests
          sonar.exclusions=**/antenv/**,**/.git/**,**/__pycache__/**,**/.scannerwork/**
          sonar.python.coverage.reportPaths=coverage.xml
          sonar.qualitygate.wait=true

    - script: |
        set -e
        source antenv/bin/activate
        python -m pip install pytest pytest-cov
        pytest -q --cov=app --cov-report=xml:coverage.xml
      workingDirectory: $(projectRoot)
      displayName: Pytest with coverage
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubeAnalyze@5
      displayName: SonarQube analyze
      condition: ne('${{ parameters.action }}', 'rollback')

    - task: SonarQubePublish@5
      displayName: SonarQube publish
      condition: ne('${{ parameters.action }}', 'rollback')
      inputs:
        pollingTimeoutSec: '300'

    - script: |
        set -e
        STAGING="$(Build.ArtifactStagingDirectory)/pkg"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        cp -a antenv app.py requirements.txt "$STAGING/"
        cp -a templates static "$STAGING/"
        [ -f startup.sh ] && cp -a startup.sh "$STAGING/"
        [ -f .deployment ] && cp -a .deployment "$STAGING/"
      workingDirectory: $(projectRoot)
      displayName: Stage package (app + antenv, no .git)

    - task: ArchiveFiles@2
      displayName: Zip package
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/pkg'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(packageName)
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(packageName)
      displayName: Upload artifact
      artifact: drop

- stage: Deploy
  displayName: Deploy Web App
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      or(
        eq('${{ parameters.action }}', 'deploy'),
        eq('${{ parameters.action }}', 'rollback')
      )
    )
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy test-webapp
            inputs:
              azureSubscription: $(azureServiceConnectionId)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(packageName)
