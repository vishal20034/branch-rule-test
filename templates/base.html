<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · AVD pipeline demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="top">
    <a class="logo" href="/">AVD pipeline demo</a>
    <nav>
      <a href="/" {% if title == "Home" %}class="on"{% endif %}>Board</a>
      <a href="/pipeline" {% if title == "Pipeline" %}class="on"{% endif %}>How it runs</a>
      <a href="/health/ui" {% if title == "Health" %}class="on"{% endif %}>Health</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
      {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
  <footer>
    Azure App Service · GitHub → GoCD → SonarQube · v{{ version }}
  </footer>
</body>
</html>
