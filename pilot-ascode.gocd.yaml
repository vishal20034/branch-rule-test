format_version: 10
pipelines:
  pilot-ascode:
    group: defaultGroup
    environment_variables:
      AZURE_RG: rg-pilot-dev
      AZURE_WEBAPP: test-webapp
    materials:
      app_git:
        git: https://github.com/vishal20034/branch-rule-test.git
        branch: main
    stages:
      - test:
          clean_workspace: true
          jobs:
            pytest:
              tasks:
                - exec:
                    command: cmd
                    arguments:
                      - /c
                      - C:/Users/X240/AppData/Local/Programs/Python/Python313/python.exe -m pip install pytest flask gunicorn && C:/Users/X240/AppData/Local/Programs/Python/Python313/python.exe -m pytest -q
      - deploy:
          jobs:
            azure:
              tasks:
                - exec:
                    command: cmd
                    arguments:
                      - /c
                      - tar -a -c -f package.zip app.py requirements.txt
               - exec:
                    command: powershell
                    arguments:
                      - -NoProfile
                      - -Command
                      - $u = [Environment]::GetEnvironmentVariable('AZURE_PUBLISH_USER','Machine'); $p = [Environment]::GetEnvironmentVariable('AZURE_PUBLISH_PASS','Machine'); Write-Host ('USER=[' + $u + '] len_pass=' + $(if ($p) {$p.Length} else {0})); if (-not $u -or -not $p) { throw 'missing AZURE_PUBLISH_USER or AZURE_PUBLISH_PASS' }; curl.exe -f -S -X POST -u ($u + ':' + $p) --data-binary @package.zip https://test-webapp-efepekhyfscpe4fk.scm.westus3-01.azurewebsites.net/api/zipdeploy
