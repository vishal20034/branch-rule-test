name: DEV - GitHub Actions -> Azure

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  WEBAPP_NAME: "test-webapp-dev"
  FUNCTION_APP_NAME: "test-function-dev"

jobs:

  pr-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          flake8 . --exclude=.git,.venv,antenv

      - name: Tests
        run: |
          export PYTHONPATH="$(pwd)"
          pytest -q tests --tb=short


  dev-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Email 1 - CI/CD started
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "[DEV] CI/CD started"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["GMAIL_TO"]
          msg.set_content(
              "CI/CD started.\n\n"
              "Branch: dev\n"
              "Environment: dev\n"
              "Deployment to Azure Dev is in progress."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(
                  os.environ["GMAIL_USER"],
                  os.environ["GMAIL_APP_PASSWORD"]
              )
              server.send_message(msg)
          PY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and test
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov
          export PYTHONPATH="$(pwd)"
          pytest -q tests --tb=short

      - name: Build package once
        run: |
          set -e

          rm -rf package
          mkdir -p package/webapp
          mkdir -p package/function

          cp -a app.py requirements.txt package/webapp/

          [ -d templates ] && cp -a templates package/webapp/
          [ -d static ] && cp -a static package/webapp/
          [ -f startup.sh ] && cp -a startup.sh package/webapp/
          [ -f .deployment ] && cp -a .deployment package/webapp/

          cp -a . package/function/ \
            --exclude=.git \
            --exclude=package \
            --exclude=antenv \
            --exclude=tests

          cd package/webapp
          zip -r ../../webapp.zip .

          cd ../function
          zip -r ../../function.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Dev App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: webapp.zip

      - name: Deploy Azure Dev Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: function.zip

      - name: Email 3 - Succeeded
        if: success()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "[DEV] CI/CD Succeeded"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["GMAIL_TO"]
          msg.set_content(
              "CI/CD succeeded.\n\n"
              "Branch: dev\n"
              "Environment: dev\n"
              "Azure Dev Function App: deployed\n"
              "Azure Dev App Service: deployed."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(
                  os.environ["GMAIL_USER"],
                  os.environ["GMAIL_APP_PASSWORD"]
              )
              server.send_message(msg)
          PY

      - name: Email 2 - Failed
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "[DEV] CI/CD Failed"
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = os.environ["GMAIL_TO"]
          msg.set_content(
              "CI/CD failed.\n\n"
              "Branch: dev\n"
              "Environment: dev\n"
              "The pipeline has stopped. Check the GitHub Actions logs."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(
                  os.environ["GMAIL_USER"],
                  os.environ["GMAIL_APP_PASSWORD"]
              )
              server.send_message(msg)
          PY
