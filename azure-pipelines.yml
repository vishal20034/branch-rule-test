DEV — GITHUB ACTIONS → AZURE

No SonarQube | No tag | No release note | No approver

        ▼

1. Create feat/* branch from dev
   Developer works in isolation

        ▼

2. Open Pull Request
   feat/* → dev

   CI runs:
   - Lint
   - Unit tests

   No deployment

        ▼

3. Merge Pull Request into dev

   This merge triggers the Dev pipeline

        ▼

4. Email 1 — "CI/CD started"

   Team knows Dev deployment is in progress

        ▼

5. Build / Test

   - Checkout merged dev commit
   - Install dependencies
   - Run tests
   - Prepare application

        ▼

6. Build the package ONCE

   Create artifacts from the same commit:

   - Function App artifact
   - App Service artifact

        ▼

7. Deploy to Azure Dev

   Function App + App Service

   GitHub Environment: dev
   No required reviewers

        ▼

8. Email result

   SUCCESS:
   "CI/CD succeeded"

   OR

   FAILURE:
   "CI/CD failed"

   Failure stops the pipeline
